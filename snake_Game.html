<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>
    <style>
        body { text-align: center; font-family: Arial; }
        canvas { border: 2px solid black; background: #f9f9f9; }
        button { margin: 8px 4px; padding: 8px 14px; cursor: pointer; }
        #message { min-height: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span> | 최고 점수: <span id="highScore">0</span> | 레벨: <span id="level">1</span></p>
    <p>조작: 방향키 또는 WASD / 스페이스바: 일시정지</p>
    <button id="pauseButton">일시정지</button>
    <button id="restartButton">다시 시작</button>
    <p id="message">먹이를 먹으면 조금씩 빨라집니다.</p>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");
        const highScoreText = document.getElementById("highScore");
        const levelText = document.getElementById("level");
        const pauseButton = document.getElementById("pauseButton");
        const restartButton = document.getElementById("restartButton");
        const messageText = document.getElementById("message");
        let score = 0;
        let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
        highScoreText.textContent = highScore;
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x:10, y:10}];
        let food = {x:5, y:5};
        let bonusFood = false;
        let level = 1;
        let obstacles = [];
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let gameOver = false;
        let paused = false;
        let gameSpeed = 500;
        let gameTimer;

        function drawTile(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x*gridSize, y*gridSize, gridSize-2, gridSize-2);
        }

        function drawSnake() {
            for(let i = 0; i < snake.length; i++) {
                if(i == 0) {
                    drawTile(snake[i].x, snake[i].y, "green");
                } else {
                    drawTile(snake[i].x, snake[i].y, "limegreen");
                }
            }
        }

        function drawFood() {
            drawTile(food.x, food.y, bonusFood ? "gold" : "red");
        }

        function drawObstacles() {
            for (const obstacle of obstacles) {
                drawTile(obstacle.x, obstacle.y, "gray");
            }
        }

        drawSnake();
        drawFood();
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const key = event.key.toLowerCase();
            if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
                event.preventDefault();
            }
            if (key === " " && !event.repeat) togglePause();

            if ((key === "arrowup" || key === "w") && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }
            if ((key === "arrowdown" || key === "s") && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }
            if ((key === "arrowleft" || key === "a") && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }
            if ((key === "arrowright" || key === "d") && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;
            const head = {x:snake[0].x + dx, y:snake[0].y + dy};
            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                score += bonusFood ? 3 : 1;
                messageText.textContent = bonusFood ? "보너스 먹이! 3점을 얻었습니다." : "먹이를 먹으면 조금씩 빨라집니다.";
                scoreText.textContent = score;
                updateHighScore();
                updateLevel();
                moveFood();
                updateSpeed();
            } else {
                snake.pop();
            }
        }

        function moveFood() {
            do {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            } while (snake.some(part => part.x === food.x && part.y === food.y) ||
                     obstacles.some(obstacle => obstacle.x === food.x && obstacle.y === food.y));
            bonusFood = Math.random() < 0.2;
        }

        function updateLevel() {
            const newLevel = Math.floor(score / 5) + 1;
            while (level < newLevel) {
                level++;
                addObstacle();
            }
            levelText.textContent = level;
        }

        function addObstacle() {
            let obstacle;
            do {
                obstacle = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(part => part.x === obstacle.x && part.y === obstacle.y) ||
                     obstacles.some(item => item.x === obstacle.x && item.y === obstacle.y) ||
                     (food.x === obstacle.x && food.y === obstacle.y));
            obstacles.push(obstacle);
        }

        function checkCollision() {
            const head = snake[0];
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) endGame();

            for(let i = 1; i < snake.length; i++) {
                if(head.x === snake[i].x && head.y === snake[i].y) endGame();
            }

            if (obstacles.some(obstacle => head.x === obstacle.x && head.y === obstacle.y)) {
                endGame();
            }
        }

        function endGame() {
            gameOver = true;
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText("게임 오버!", canvas.width/2, canvas.height/2-20);
            ctx.fillText("점수 : " + score, canvas.width/2, canvas.height/2+30);
            messageText.textContent = "다시 시작 버튼을 눌러 재도전하세요.";
            pauseButton.disabled = true;
        }

        function gameLoop() {
            if (gameOver || paused) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            moveSnake();
            checkCollision();
            if (gameOver) return;
            drawSnake();
            drawFood();
            drawObstacles();
        }

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                highScoreText.textContent = highScore;
                localStorage.setItem("snakeHighScore", highScore);
            }
        }

        function updateSpeed() {
            const newSpeed = Math.max(120, 500 - score * 25);
            if (newSpeed !== gameSpeed) {
                gameSpeed = newSpeed;
                clearInterval(gameTimer);
                gameTimer = setInterval(gameLoop, gameSpeed);
            }
        }

        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            pauseButton.textContent = paused ? "계속하기" : "일시정지";
            messageText.textContent = paused ? "게임이 일시정지되었습니다." : "먹이를 먹으면 조금씩 빨라집니다.";
        }

        function restartGame() {
            snake = [{x:10, y:10}];
            food = {x:5, y:5};
            bonusFood = false;
            level = 1;
            obstacles = [];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreText.textContent = score;
            levelText.textContent = level;
            gameOver = false;
            paused = false;
            gameSpeed = 500;
            pauseButton.disabled = false;
            pauseButton.textContent = "일시정지";
            messageText.textContent = "먹이를 먹으면 조금씩 빨라집니다.";
            clearInterval(gameTimer);
            gameTimer = setInterval(gameLoop, gameSpeed);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSnake();
            drawFood();
            drawObstacles();
        }

        pauseButton.addEventListener("click", togglePause);
        restartButton.addEventListener("click", restartGame);
        gameTimer = setInterval(gameLoop, gameSpeed);
    </script>
</body>
</html>
