<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>벽돌깨기 게임</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #f5f5f5; }
        .controls { margin: 15px 0; line-height: 2.5; }
        button, select { padding: 6px 10px; font-size: 14px; }
        button { cursor: pointer; }
        canvas { background: white; border: 2px solid #333; max-width: 95%; height: auto; }
        #message { color: #444; min-height: 24px; }
        .help { font-size: 14px; }
    </style>
</head>
<body>
    <h1>벽돌깨기 게임</h1>
    <div class="controls">
        <button id="startButton" type="button">게임 시작</button>
        <button id="pauseButton" type="button" disabled>일시정지</button>
        <button id="restartButton" type="button">다시 시작</button>
        <label for="speedSelect">공 속도:</label>
        <select id="speedSelect">
            <option value="1">1단계 (느림)</option>
            <option value="2" selected>2단계 (보통)</option>
            <option value="3">3단계 (빠름)</option>
            <option value="4">4단계 (매우 빠름)</option>
            <option value="5">5단계 (가장 빠름)</option>
        </select>
    </div>
    <p>점수: <span id="score">0</span> | 목숨: <span id="lives">3</span> | 스테이지: <span id="stage">1</span> / 3</p>
    <p class="help">← / → 또는 마우스: 이동 | Space: 시작·계속 | P: 일시정지 | R: 다시 시작</p>
    <p class="help">초록 E: 패들 확대 8초 | 노랑 L: 목숨 +1 (최대 5개)</p>
    <canvas id="gameCanvas" width="600" height="400" tabindex="0" aria-label="벽돌깨기 게임 화면">Canvas를 지원하는 브라우저에서 실행하세요.</canvas>
    <p id="message" role="status">게임 시작 버튼이나 Space를 누르세요.</p>

<script>
    // 제공된 예제를 바탕으로 수정했습니다. 출처와 도움 받은 내용은 readme.md에 적었습니다.
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const stageText = document.getElementById("stage");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const pauseButton = document.getElementById("pauseButton");
    const speedSelect = document.getElementById("speedSelect");

    let score = 0;
    let lives = 3;
    let stage = 1;
    let started = false;
    let paused = false;
    let gameOver = false;
    let cleared = false;
    let leftPressed = false;
    let rightPressed = false;
    let speed = 4;
    let items = [];
    let expandTime = 0;
    let bricks = [];
    let remainingBricks = 0;

    const paddle = { x: 250, y: 370, width: 100, height: 12 };
    const ball = { x: 300, y: 350, radius: 8, dx: 2.4, dy: -3.2 };
    const brickWidth = 60;
    const brickHeight = 20;
    const colors = ["#3498db", "#9b59b6", "#e67e22"];

    function updateInfo() {
        scoreText.textContent = score;
        livesText.textContent = lives;
        stageText.textContent = stage;
        startButton.disabled = started && !gameOver && !paused;
        startButton.textContent = paused ? "계속하기" : "게임 시작";
        pauseButton.disabled = !started || gameOver;
        pauseButton.textContent = paused ? "계속하기" : "일시정지";
        speedSelect.disabled = started && !gameOver;
    }

    // 스테이지가 올라갈 때 벽돌을 한 줄씩 더 만듭니다.
    function initBricks() {
        bricks = [];
        const rows = stage + 3;
        remainingBricks = rows * 8;
        for (let row = 0; row < rows; row++) {
            bricks[row] = [];
            for (let column = 0; column < 8; column++) {
                bricks[row][column] = {
                    x: 25 + column * 70,
                    y: 40 + row * 30,
                    visible: true
                };
            }
        }
    }

    function resetBallAndPaddle() {
        expandTime = 0;
        items = [];
        paddle.width = 100;
        paddle.x = 250;
        ball.x = 300;
        ball.y = 350;
        ball.dx = speed * 0.6;
        if (Math.random() < 0.5) ball.dx = -ball.dx;
        ball.dy = -speed * 0.8;
        leftPressed = false;
        rightPressed = false;
    }

    function startGame() {
        if (paused && !gameOver) { togglePause(); return; }
        if (started && !gameOver) return;
        score = 0;
        lives = 3;
        stage = 1;
        started = true;
        paused = false;
        gameOver = false;
        cleared = false;
        speed = Number(speedSelect.value) + 2;
        lastTime = null;
        elapsedTime = 0;
        initBricks();
        resetBallAndPaddle();
        message.textContent = "벽돌을 모두 깨면 다음 스테이지로 넘어갑니다.";
        updateInfo();
    }

    function restartGame() {
        started = false;
        paused = false;
        startGame();
    }

    function togglePause() {
        if (!started || gameOver) return;
        paused = !paused;
        lastTime = null;
        elapsedTime = 0;
        leftPressed = false;
        rightPressed = false;
        message.textContent = paused ? "일시정지 중입니다." : "게임을 계속합니다.";
        updateInfo();
    }

    function movePaddle() {
        if (leftPressed) paddle.x -= 7;
        if (rightPressed) paddle.x += 7;
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
    }

    function nextStage() {
        if (stage === 3) {
            cleared = true;
            gameOver = true;
            items = [];
            expandTime = 0;
            paddle.width = 100;
            if (paddle.x > 500) paddle.x = 500;
            message.textContent = "모든 스테이지를 완료했습니다! 점수: " + score;
        } else {
            stage++;
            initBricks();
            resetBallAndPaddle();
            message.textContent = stage + "스테이지 시작!";
        }
        updateInfo();
    }

    function checkBrickCollision(previousX, previousY) {
        for (let row = 0; row < bricks.length; row++) {
            for (let column = 0; column < 8; column++) {
                const brick = bricks[row][column];
                if (!brick.visible) continue;
                if (ball.x + ball.radius < brick.x || ball.x - ball.radius > brick.x + brickWidth ||
                    ball.y + ball.radius < brick.y || ball.y - ball.radius > brick.y + brickHeight) continue;

                // 공이 들어온 방향에 맞춰 반사하고 벽돌 밖으로 빼냅니다.
                if (previousX + ball.radius <= brick.x) {
                    ball.x = brick.x - ball.radius - 0.1;
                    ball.dx = -Math.abs(ball.dx);
                } else if (previousX - ball.radius >= brick.x + brickWidth) {
                    ball.x = brick.x + brickWidth + ball.radius + 0.1;
                    ball.dx = Math.abs(ball.dx);
                } else if (previousY + ball.radius <= brick.y) {
                    ball.y = brick.y - ball.radius - 0.1;
                    ball.dy = -Math.abs(ball.dy);
                } else {
                    ball.y = brick.y + brickHeight + ball.radius + 0.1;
                    ball.dy = Math.abs(ball.dy);
                }
                brick.visible = false;
                score++;
                remainingBricks--;
                if (remainingBricks === 0) {
                    nextStage();
                } else if (Math.random() < 0.25) {
                    const type = Math.random() < 0.5 ? "E" : "L";
                    items.push({ x: brick.x + brickWidth / 2, y: brick.y + brickHeight, type: type });
                }
                updateInfo();
                return true;
            }
        }
        return false;
    }

    function moveBall() {
        // 빠른 공도 벽돌을 지나치지 않도록 한 번의 이동을 두 번으로 나눕니다.
        for (let step = 0; step < 2; step++) {
            const previousX = ball.x;
            const previousY = ball.y;
            ball.x += ball.dx / 2;
            ball.y += ball.dy / 2;
            if (ball.x < ball.radius) { ball.x = ball.radius; ball.dx = Math.abs(ball.dx); }
            if (ball.x > canvas.width - ball.radius) { ball.x = canvas.width - ball.radius; ball.dx = -Math.abs(ball.dx); }
            if (ball.y < ball.radius) { ball.y = ball.radius; ball.dy = Math.abs(ball.dy); }
            if (ball.dy > 0 && previousY + ball.radius <= paddle.y && ball.y + ball.radius >= paddle.y &&
                ball.x + ball.radius >= paddle.x && ball.x - ball.radius <= paddle.x + paddle.width) {
                ball.y = paddle.y - ball.radius - 0.1;
                ball.dy = -Math.abs(ball.dy);
            }
            const previousStage = stage;
            checkBrickCollision(previousX, previousY);
            if (gameOver || stage !== previousStage) return;
            if (ball.y - ball.radius > canvas.height) {
                lives--;
                resetBallAndPaddle();
                if (lives === 0) {
                    gameOver = true;
                    message.textContent = "게임 종료! 다시 시작 버튼을 누르세요.";
                } else {
                    message.textContent = "목숨을 잃었습니다. 남은 목숨: " + lives;
                }
                updateInfo();
                return;
            }
        }
    }

    function moveItems() {
        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            item.y += 2;
            if (item.x + 10 >= paddle.x && item.x - 10 <= paddle.x + paddle.width &&
                item.y + 10 >= paddle.y && item.y - 10 <= paddle.y + paddle.height) {
                if (item.type === "E") {
                    paddle.width = 150;
                    if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
                    expandTime = 8;
                    message.textContent = "패들이 8초 동안 넓어집니다.";
                } else {
                    if (lives < 5) lives++;
                    message.textContent = "목숨 아이템을 얻었습니다.";
                }
                items.splice(i, 1);
                updateInfo();
            } else if (item.y > canvas.height + 10) {
                items.splice(i, 1);
            }
        }
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let row = 0; row < bricks.length; row++) {
            for (let column = 0; column < 8; column++) {
                const brick = bricks[row][column];
                if (brick.visible) {
                    ctx.fillStyle = colors[stage - 1];
                    ctx.fillRect(brick.x, brick.y, brickWidth, brickHeight);
                }
            }
        }
        ctx.fillStyle = "#333";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "tomato";
        ctx.fill();
        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            ctx.beginPath();
            ctx.arc(item.x, item.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = item.type === "E" ? "#2ecc71" : "#f1c40f";
            ctx.fill();
            ctx.fillStyle = "#222";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.fillText(item.type, item.x, item.y + 4);
        }
        if (!started || paused || gameOver) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#333";
            ctx.font = "bold 26px Arial";
            ctx.textAlign = "center";
            let text = "게임 시작 버튼을 누르세요";
            if (paused) text = "일시정지";
            if (gameOver) text = cleared ? "전체 클리어!" : "게임 종료";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        }
    }

    // 화면 주사율이 달라도 초당 60번 같은 양만큼 움직이게 합니다.
    let lastTime = null;
    let elapsedTime = 0;
    function gameLoop(time) {
        if (lastTime !== null && started && !paused && !gameOver) {
            elapsedTime += Math.min(time - lastTime, 50);
            while (elapsedTime >= 1000 / 60) {
                movePaddle();
                moveBall();
                if (gameOver) { elapsedTime = 0; break; }
                moveItems();
                if (expandTime > 0) {
                    expandTime = Math.max(0, expandTime - 1 / 60);
                    if (expandTime === 0) paddle.width = 100;
                }
                elapsedTime -= 1000 / 60;
            }
        } else {
            elapsedTime = 0;
        }
        lastTime = time;
        drawGame();
        requestAnimationFrame(gameLoop);
    }

    startButton.addEventListener("click", startGame);
    pauseButton.addEventListener("click", togglePause);
    document.getElementById("restartButton").addEventListener("click", restartGame);
    speedSelect.addEventListener("change", function() {
        if (started && !gameOver) return;
        speed = Number(speedSelect.value) + 2;
        resetBallAndPaddle();
    });
    document.addEventListener("keydown", function(event) {
        if (event.target.tagName === "SELECT" || event.target.tagName === "INPUT") return;
        if (event.code === "Space" && event.target.tagName === "BUTTON") return;
        if (event.code === "ArrowLeft" || event.code === "ArrowRight" || event.code === "Space") event.preventDefault();
        if (event.code === "ArrowLeft") leftPressed = true;
        if (event.code === "ArrowRight") rightPressed = true;
        if (!event.repeat) {
            if (event.code === "Space") startGame();
            if (event.code === "KeyP") togglePause();
            if (event.code === "KeyR") restartGame();
        }
    });
    document.addEventListener("keyup", function(event) {
        if (event.code === "ArrowLeft") leftPressed = false;
        if (event.code === "ArrowRight") rightPressed = false;
    });
    canvas.addEventListener("mousemove", function(event) {
        if (!started || paused || gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = (event.clientX - rect.left) * canvas.width / rect.width;
        paddle.x = Math.max(0, Math.min(mouseX - paddle.width / 2, canvas.width - paddle.width));
    });
    canvas.addEventListener("click", function() {
        canvas.focus();
        startGame();
    });
    window.addEventListener("blur", function() {
        leftPressed = false;
        rightPressed = false;
        if (started && !paused && !gameOver) togglePause();
    });
    document.addEventListener("visibilitychange", function() {
        if (document.hidden) {
            leftPressed = false;
            rightPressed = false;
            if (started && !paused && !gameOver) togglePause();
        }
    });
    initBricks();
    resetBallAndPaddle();
    updateInfo();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
