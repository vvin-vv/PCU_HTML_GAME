<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>예제 1: 무지개 과녁</title>
</head>

<body>
    <canvas id="myCanvas" width="400" height="400" style="background: #222;"></canvas>
    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const circles = [
            { color: "red", radius: 120 },
            { color: "orange", radius: 95 },
            { color: "yellow", radius: 70 },
            { color: "green", radius: 45 },
            { color: "blue", radius: 20 }
        ];

        circles.forEach((circle) => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, circle.radius, 0, Math.PI * 2);
            ctx.fillStyle = circle.color;
            ctx.fill();
        });
    </script>

</body>

</html>
